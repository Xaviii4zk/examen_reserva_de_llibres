<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
        }

        h2 {
            color:#428bca;
            margin-bottom: 20px;
        }

        .contenedor {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            height: 100%;
        }

        .reserva {
            background-color: #e8fefc;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;   
        }

        .reserva strong {
            color: #428bca;
        }

        .tabla th {
            background-color: #cfe2ff;
        }
    </style>
</head>

<body>
    <div class="container-fluid mt-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="contenedor">
                    <h2>Libros Disponibles</h2>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Título</th>
                                    <th>Autor</th>
                                    <th>Género</th>
                                    <th>Año</th>
                                </tr>
                            </thead>
                            <tbody id="tablaLibros">

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="contenedor">
                    <h2>Reserva un Libro</h2>
                    <div class="row mb-4">
                        <div class="col-md-10 mb-2">
                            <select id="seleccionLibro" class="form-select">
                                <option value="">Selecciona un libro</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button id="reservar" class="btn btn-primary w-100">
                                Reservar
                            </button>
                        </div>
                    </div>
                    <div id="mensaje"></div>
                    <hr>
                    <h2>Reservas Realizadas</h2>
                    <div id="listaReservas">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let llibres = [
            {
                id: 1,
                titol: "1984",
                autor: "George Orwell",
                genere: "Distopía",
                any: 1949
            },
            {
                id: 2,
                titol: "Orgullo y Prejuicio",
                autor: "Jane Austen",
                genere: "Romance",
                any: 1813
            },
            {
                id: 3,
                titol: "Cien años de soledad",
                autor: "Gabriel García Márquez",
                genere: "Realismo Mágico",
                any: 1967
            },
            {
                id: 4,
                titol: "El Gran Gatsby",
                autor: "F. Scott Fitzgerald",
                genere: "Tragedia",
                any: 1925
            },
            {
                id: 5,
                titol: "Matar a un ruiseñor",
                autor: "Harper Lee",
                genere: "Ficción",
                any: 1960
            }
        ];

        //El array que se utiliza para hacer referencia a los libros
        // Que quieres pedir

        let reservas = [];

        // Array que guarda los libros que se reservan (hasta recargar la página)


        let tablaLibros = document.getElementById("tablaLibros");
        let seleccionLibro = document.getElementById("seleccionLibro");
        let botonReservar = document.getElementById("reservar");
        let listaReservas = document.getElementById("listaReservas");
        let mensaje = document.getElementById("mensaje");

        //Seleccionar los elementos para mostrarlos seleccionar o poder mostrar

        function mostrarLibros() {

            for (let i = 0; i < llibres.length; i++) {
                tablaLibros.innerHTML += `
                    <tr>
                        <td>${llibres[i].titol}</td>
                        <td>${llibres[i].autor}</td>
                        <td>${llibres[i].genere}</td>
                        <td>${llibres[i].any}</td>
                    </tr>
                `;

                // tablaLibros con innerHTML muestra todos los libres con
                // su titulo, autor, genero y año

                seleccionLibro.innerHTML += `
                    <option value="${llibres[i].id}">
                        ${llibres[i].titol}
                    </option>
                `;

                // seleccionLibro con innerHTML añade las opciones con el valor
                // de el id de los libros pero para que los usuarios puedan ver
                // el libro que quieren muestra el titulo pero se registra el id del
                // libro que se escoge, no el nombre
            }
        }



        function reservarLibro() {
            let idLibro = seleccionLibro.value;

            if (idLibro == "") {
                mensaje.innerHTML = `
                    <div class="alert alert-danger">
                        Selecciona un libro antes de reservar.
                    </div>
                `;
                return;
            }

            // Este if hace que si no hay libro seleccionado y está seleccionada
            // la opción default entonces suelta un mensaje de error para que seleccione uno

            let libroSeleccionado;

            for (let i = 0; i < llibres.length; i++) {
                if (llibres[i].id == idLibro) {
                    libroSeleccionado = llibres[i];
                }
            }

            // Como se guarda el id y no el titulo y idLibro = el valor del libro escogido
            // Si libro = al valor del libro seleccionado libroSeleccionado esta variable
            // guarda el libro que esté en llibres[i];

            let fecha = new Date();

            // Se usa para guardar cuando se hace la reserva

            let reserva = {
                libro: libroSeleccionado,
                fecha: fecha
            };

            // Se hace un array para mostrar las reservas aprovechando el valor
            // de libro seleccionado y la fecha para saber cuando se hace la reserva

            reservas.unshift(reserva);

            // Se hace reservas.unshift(reserva); para que la reserva más reciente
            // este al principio del array, no al final cómo con push

            mensaje.innerHTML = `
                <div class="alert alert-success">
                    ¡Libro reservado correctamente!
                </div>
            `;

            // Si se detecta que se escoge un libro muesta un mensaje de que la operación
            // Se ha logrado con éxitp

            seleccionLibro.value = "";

            // Al realizar una reserva la opción seleccionada vuelve a la Default (Escoge un libro)

            mostrarReservas();
        }

        function mostrarReservas() {
            listaReservas.innerHTML = "";
            for (let i = 0; i < reservas.length; i++) {
                let fecha = reservas[i].fecha.toLocaleDateString("es-ES");
                let hora = reservas[i].fecha.toLocaleTimeString("es-ES");

                // Al haber usado fecha, se mira en el array de reservas y tener la fecha guardada
                // Se el formato y se aprovecha para mostrar el día y la hora de la reserva realizada.

                listaReservas.innerHTML += `
                    <div class="reserva">
                        <strong>${reservas[i].libro.titol}</strong>
                        por ${reservas[i].libro.autor}
                        - Reservado el: ${fecha}, ${hora}
                    </div>
                `;

                // Este es el mensaje que se muestra en cada reserva que se hace
                    
            }
        }

        botonReservar.addEventListener("click", reservarLibro);

        // Cada vez que se clica en el botón reserva, la función reservarLibro se ejecuta.

        mostrarLibros();

    </script>  
</body>
</html>
